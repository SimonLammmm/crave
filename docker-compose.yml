services:
  crave:
    image: simonlammmm/crave:6.0.1
    ports:
      - "8080:3838"
    volumes:
      # Required: config.R configuration file. Copy from config.example.R and edit as needed
      - "./shiny-server/config.example.R:/app/config.R"
      # Required: CRAVE format dataset. Specify the container-side path in config.R
      - "./example-dataset/data/:/data/dataset-1/"

      # Optional: additional volume declarations
      #- "/path/to/dataset-2/:/data/dataset-2/"

      # Optional: Exorcise dataset and Docker socket
      #- "/path/to/exorcise/data:/data/exorcise/"
      #- "/var/run/docker.sock:/var/run/docker.sock"

      # The Submit and Manage tabs need that socket too, and nothing else: they run
      # exorcise-analyse and exorcise-database, which read a workbook and a counts
      # table rather than a genome. They do need each writable dataset to declare a
      # `hostpath` in config.R, because the daemon on the other end of the socket
      # resolves bind mounts on the host, not in this container.

      # Optional: branding assets
      #- "/path/to/branding/assets/:/app/www/"